<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NGI Hostel Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f4fb;
            color: #252747;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #252747;
            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: #70758a;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5d9e5;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #6978d8;
            border-color: #6978d8;
        }

        button {
            width: 100%;
            margin-top: 23px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #303c85;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .error {
            display: block !important;
            background: #fff0f0;
            color: #b42318;
        }

        .success {
            display: block !important;
            background: #eaf8ef;
            color: #16743b;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #303c85;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="login-container">
        <h1>Admin Portal</h1>

        <p class="subtitle">
            Nehru Group of Institutions<br>
            Hostel Management System
        </p>

        <form id="adminLoginForm">
            <label for="username">Admin Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>
        </form>

        <div id="message" role="alert"></div>

        <a class="back-link" href="dashboard.html">
            Back to Dashboard
        </a>
    </main>

    <script>
        const API_BASE =
            "https://hostel-management-system-api-426c.onrender.com";

        const form = document.getElementById("adminLoginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            button.disabled = true;
            button.textContent = "Logging in...";
            message.className = "";
            message.textContent = "";

            try {
                const response = await fetch(
                    API_BASE + "/api/admin/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || result.success !== true) {
                    throw new Error(
                        result.message ||
                        result.error ||
                        "Login failed. Check your admin credentials."
                    );
                }

                if (!result.token) {
                    throw new Error(
                        "Login succeeded, but the server did not return an admin token."
                    );
                }

                localStorage.setItem("adminToken", result.token);

                showMessage("Login successful. Opening Admin Portal...", "success");

                window.location.href = "admin.html";

            } catch (error) {
                console.error("Admin login error:", error);

                if (error instanceof TypeError) {
                    showMessage(
                        "Network or CORS error. Check the browser console and ensure the deployed frontend is using this updated file.",
                        "error"
                    );
                } else {
                    showMessage(error.message, "error");
                }
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>

</body>
</html>
