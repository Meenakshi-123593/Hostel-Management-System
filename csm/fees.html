<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGI Hostel Admin - Fees</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#243047}
header{background:#173b70;color:white;padding:20px;text-align:center}
.container{max-width:1200px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #00000010}
h2{color:#173b70;margin-top:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box{background:#edf4ff;padding:16px;border-radius:8px}
.box strong{display:block;font-size:21px;margin-top:8px}
input,select{padding:11px;border:1px solid #ccd4e0;border-radius:7px;width:100%;margin:5px 0 12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e5eaf1}
th{background:#eaf1fb}
.paid{color:#168044;font-weight:bold}
.pending{color:#c17a00;font-weight:bold}
.error{color:#b42318}
.muted{color:#64748b}
@media(max-width:600px){.summary{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>
<h1>NGI Hostel Management System</h1>
<p>Admin — Student Fee Records</p>
</header>

<main class="container">

<section class="card">
<h2>Overall Fee Summary</h2>
<div class="summary">
<div class="box">Total Fees<strong id="grandTotal">₹0</strong></div>
<div class="box">Total Paid<strong id="grandPaid">₹0</strong></div>
<div class="box">Total Balance<strong id="grandBalance">₹0</strong></div>
</div>
</section>

<section class="card">
<h2>Academic Year Fee Details</h2>

<label for="yearFilter">Filter by academic year</label>
<select id="yearFilter">
<option value="all">All Academic Years</option>
<option value="1">First Year</option>
<option value="2">Second Year</option>
<option value="3">Third Year</option>
<option value="4">Fourth Year</option>
</select>

<label for="searchStudent">Search student</label>
<input id="searchStudent" type="text" placeholder="Enter student name or ID">

<p id="message" class="muted">Loading student fee records...</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Student ID</th>
<th>Student Name</th>
<th>Academic Year</th>
<th>Total Fee</th>
<th>Paid Amount</th>
<th>Balance</th>
<th>Status</th>
</tr>
</thead>
<tbody id="feeRecords">
<tr><td colspan="7">Loading records...</td></tr>
</tbody>
</table>
</div>
</section>

</main>

<script>
const API_BASE="https://hostel-management-system-api-426c.onrender.com";

const YEAR_FEES={1:3000,2:4000,3:5000,4:6000};

const YEAR_NAMES={
  1:"First Year",
  2:"Second Year",
  3:"Third Year",
  4:"Fourth Year"
};

let allRecords=[];

function money(value){
  return "₹"+Number(value||0).toLocaleString("en-IN");
}

function getValue(obj,keys,fallback=""){
  for(const key of keys){
    if(obj[key]!==undefined && obj[key]!==null && obj[key]!==""){
      return obj[key];
    }
  }
  return fallback;
}

function normalizeStudent(row){
  return {
    id:String(getValue(row,["student_id","studentId","register_number","id"],"Unknown")),
    name:String(getValue(row,["name","student_name","full_name","username"],"Student")),
    courseYear:Number(getValue(row,["year_of_study","current_year","study_year","student_year"],1))
  };
}

function normalizeFee(row){
  const year=Number(getValue(row,["academic_year","year","year_of_study"],0));
  if(year<1 || year>4)return null;

  const total=Number(getValue(row,["total_amount","total_fee","total"],YEAR_FEES[year]));
  const paid=Number(getValue(row,["paid_amount","amount_paid","paid"],0));
  const safePaid=Math.min(total,Math.max(0,paid));
  const balance=Math.max(0,total-safePaid);

  return {
    year,
    total,
    paid:safePaid,
    balance,
    status:balance===0?"Paid":"Pending"
  };
}

function render(){
  const filter=document.getElementById("yearFilter").value;
  const search=document.getElementById("searchStudent").value.toLowerCase().trim();

  const rows=allRecords.filter(r=>{
    const matchesYear=filter==="all"||String(r.year)===filter;
    const matchesSearch=(r.id+" "+r.name).toLowerCase().includes(search);
    return matchesYear&&matchesSearch;
  });

  const tbody=document.getElementById("feeRecords");
  tbody.innerHTML="";

  if(rows.length===0){
    tbody.innerHTML='<tr><td colspan="7">No matching fee records found.</td></tr>';
  }

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    const values=[r.id,r.name,YEAR_NAMES[r.year],money(r.total),money(r.paid),money(r.balance)];

    values.forEach(value=>{
      const td=document.createElement("td");
      td.textContent=value;
      tr.appendChild(td);
    });

    const status=document.createElement("td");
    status.textContent=r.status;
    status.className=r.status==="Paid"?"paid":"pending";
    tr.appendChild(status);
    tbody.appendChild(tr);
  });

  const totals=allRecords.reduce((result,r)=>{
    result.total+=r.total;
    result.paid+=r.paid;
    result.balance+=r.balance;
    return result;
  },{total:0,paid:0,balance:0});

  document.getElementById("grandTotal").textContent=money(totals.total);
  document.getElementById("grandPaid").textContent=money(totals.paid);
  document.getElementById("grandBalance").textContent=money(totals.balance);

  document.getElementById("message").textContent=
    allRecords.length+" student academic-year fee records loaded.";
}

async function loadRecords(){
  const tbody=document.getElementById("feeRecords");

  try{
    const response=await fetch(API_BASE+"/api/admin/fees");
    const data=await response.json();

    if(!response.ok){
      throw new Error(data.message||data.error||"Unable to load admin fee records.");
    }

    const feeRows=Array.isArray(data)?data:
      Array.isArray(data.fees)?data.fees:
      Array.isArray(data.records)?data.records:
      Array.isArray(data.yearly_fees)?data.yearly_fees:null;

    if(!feeRows){
      throw new Error("The backend returned an unsupported fee-record format.");
    }

    allRecords=[];

    feeRows.forEach(row=>{
      const fee=normalizeFee(row);
      if(!fee)return;

      const student=normalizeStudent(row);

      allRecords.push({
        ...student,
        ...fee
      });
    });

    render();

  }catch(error){
    tbody.innerHTML='<tr><td colspan="7">Unable to load records from the backend.</td></tr>';
    document.getElementById("message").textContent=error.message;
    document.getElementById("message").className="error";
  }
}

document.getElementById("yearFilter").addEventListener("change",render);
document.getElementById("searchStudent").addEventListener("input",render);

loadRecords();
</script>
</body>
</html>
