<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - NGI Hostel Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Nehru Group of Institutions</h1>
    <p>Student Registration</p>
</header>

<main>
    <h2>Create Your Account</h2>

    <form id="registerForm">
        <label for="studentId">Student ID:</label><br>
        <input type="text" id="studentId" pattern="STU[0-9]{3}"
               placeholder="Example: STU001" required><br><br>

        <label for="name">Student Name:</label><br>
        <input type="text" id="name" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" required><br><br>

        <label for="department">Department:</label><br>
        <select id="department" required>
            <option value="">Select Department</option>
            <option>Computer Science Engineering</option>
            <option>Information Technology</option>
            <option>Electronics and Communication Engineering</option>
            <option>Electrical and Electronics Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Artificial Intelligence and Data Science</option>
        </select><br><br>

        <label for="year">College Year:</label><br>
        <select id="year" required>
            <option value="">Select College Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select><br><br>

        <label for="academicYear">Academic Year:</label><br>
        <select id="academicYear" required>
            <option value="">Select Academic Year</option>
            <option>2021-2024</option>
            <option>2025-2028</option>
            <option>2029-2032</option>
        </select><br><br>

        <label for="roomNumber">Room Number:</label><br>
        <select id="roomNumber" required>
            <option value="">Select Room Number</option>
            <option>101</option><option>102</option>
            <option>103</option><option>104</option>
            <option>201</option><option>202</option>
            <option>203</option><option>204</option>
            <option>301</option><option>302</option>
            <option>303</option><option>304</option>
        </select><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" pattern="[0-9]{10}"
               maxlength="10" required><br><br>

        <label for="username">Username:</label><br>
        <input type="text" id="username" minlength="3" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" minlength="8" required><br>

        <input type="checkbox" id="showPassword">
        <label for="showPassword">Show Password</label><br><br>

        <button type="submit" id="registerButton">Register</button>
    </form>

    <p>Already registered? <a href="login.html">Login here</a></p>
    <p id="message" role="status"></p>
</main>

<script>
const API_URL = "https://hostel-management-system-6626.onrender.com";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

document.getElementById("showPassword").addEventListener("change", function () {
    document.getElementById("password").type =
        this.checked ? "text" : "password";
});

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    button.disabled = true;
    message.textContent = "Registering...";

    const student = {
        student_id: document.getElementById("studentId").value.trim().toUpperCase(),
        name: document.getElementById("name").value.trim(),
        dob: document.getElementById("dob").value,
        department: document.getElementById("department").value,
        year: document.getElementById("year").value,
        academic_year: document.getElementById("academicYear").value,
        room_number: document.getElementById("roomNumber").value,
        email: document.getElementById("email").value.trim().toLowerCase(),
        phone: document.getElementById("phone").value.trim(),
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch(`${API_URL}/api/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(student)
        });

        const result = await response.json();

        if (!response.ok || result.success === false) {
            throw new Error(result.message || "Registration failed.");
        }

        message.textContent = "Registration successful! Redirecting to login...";
        message.style.color = "green";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);

    } catch (error) {
        message.style.color = "red";
        message.textContent = error.message === "Failed to fetch"
            ? "Cannot connect to the cloud backend. Please try again."
            : error.message;
    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
