<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-brand">
        <div class="login-logo">NGI</div>
        <h1>Nehru Group of Institutions</h1>
        <p>Coimbatore, Tamil Nadu</p>
    </div>

    <div class="login-card">
        <h2>Login</h2>
        <p class="login-subtitle">Access your Hostel Portal</p>

        <form id="loginForm">
            <div class="login-field">
                <label for="username">Username</label>
                <input type="text" id="username"
                       placeholder="Enter your username" required>
            </div>

            <div class="login-field">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input type="password" id="password"
                           placeholder="Enter your password" required>

                    <button type="button" id="toggleBtn"
                            class="show-password">Show</button>
                </div>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Login
            </button>
        </form>

        <p id="message" role="status"></p>

        <p class="register-text">
            New user? <a href="register.html">Create an account</a>
        </p>

        <a href="index.html" class="login-home">Back to Home</a>
    </div>
</div>

<script>
const API_URL = "https://https://hostel-management-system-api-426c.onrender.com";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

document.getElementById("toggleBtn").addEventListener("click", function () {
    const password = document.getElementById("password");

    password.type = password.type === "password" ? "text" : "password";
    this.textContent = password.type === "password" ? "Show" : "Hide";
});

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    button.disabled = true;
    message.style.color = "blue";
    message.textContent = "Checking login details...";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
        const response = await fetch(`${API_URL}/api/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (!response.ok || !result.success || !result.student) {
            throw new Error(result.message || "Invalid username or password.");
        }

        const student = result.student;

        sessionStorage.setItem("loggedInStudent", JSON.stringify(student));
        localStorage.setItem("currentUser", JSON.stringify(student));
        sessionStorage.setItem("loggedInUser", student.username);

        message.style.color = "green";
        message.textContent = "Login successful! Opening dashboard...";

        setTimeout(function () {
            window.location.href = "dashboard.html";
        }, 1000);

    } catch (error) {
        message.style.color = "red";
        message.textContent = error.message === "Failed to fetch"
            ? "Cannot connect to the cloud backend. Please try again."
            : error.message;
    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
