<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NGI Hostel Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><header>
    <h1>Nehru Group of Institutions</h1>
    <p>Hostel Management System — Admin Portal</p>
</header><main class="login-container">
    <h2>Admin Dashboard</h2><div id="adminLoginSection">
    <h3>Admin Login</h3>

    <form id="adminLoginForm">
        <label for="adminUsername">Username</label>
        <input type="text" id="adminUsername"
               placeholder="Enter admin username" required>

        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword"
               placeholder="Enter admin password" required>

        <button type="submit">Login</button>
    </form>

    <p id="loginMessage"></p>
</div>

<div id="adminDashboard" style="display:none;">
    <p>Welcome, Administrator!</p>

    <section>
        <h3>Student Records</h3>
        <p>View registered students and their details.</p>
        <button type="button" id="viewStudents">
            View Student Records
        </button>
        <p id="message"></p>
    </section>

    <div id="studentRecords"></div>
    <button type="button" id="logout">Logout</button>
</div>

</main><script>
const API_URL = "https://hostel-management-system-api-426c.onrender.com";

const loginForm = document.getElementById("adminLoginForm");
const loginSection = document.getElementById("adminLoginSection");
const dashboard = document.getElementById("adminDashboard");
const loginMessage = document.getElementById("loginMessage");
const message = document.getElementById("message");
const records = document.getElementById("studentRecords");

async function loadStudentRecords() {
    const token = sessionStorage.getItem("adminToken");
    records.replaceChildren();

    if (!token) {
        message.textContent = "Please log in first.";
        return;
    }

    message.textContent = "Loading student records...";

    try {
        const response = await fetch(`${API_URL}/api/admin/students`, {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            message.textContent =
                result.message || "Unable to load student records.";
            return;
        }

        if (!result.students || result.students.length === 0) {
            message.textContent = "No registered students found.";
            return;
        }

        const table = document.createElement("table");
        const headings = [
            "Student ID", "Name", "Email", "Username",
            "Department", "Year", "Academic Year", "Room", "Phone"
        ];

        const header = document.createElement("tr");

        headings.forEach(item => {
            const th = document.createElement("th");
            th.textContent = item;
            header.appendChild(th);
        });

        table.appendChild(header);

        result.students.forEach(student => {
            const row = document.createElement("tr");

            [
                "student_id", "name", "email", "username",
                "department", "year", "academic_year",
                "room_number", "phone"
            ].forEach(key => {
                const cell = document.createElement("td");
                cell.textContent = student[key] ?? "-";
                row.appendChild(cell);
            });

            table.appendChild(row);
        });

        records.appendChild(table);
        message.textContent =
            `Total registered students: ${result.count ?? result.students.length}`;

    } catch (error) {
        message.textContent =
            "Unable to connect. Please check the backend connection.";
        console.error("Student records error:", error);
    }
}

loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    loginMessage.textContent = "Checking login details...";

    const username = document.getElementById("adminUsername").value.trim();
    const password = document.getElementById("adminPassword").value;

    try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (!response.ok || !result.success || !result.token) {
            loginMessage.textContent =
                result.message || "Login failed. Please try again.";
            return;
        }

        sessionStorage.setItem("adminToken", result.token);
        loginSection.style.display = "none";
        dashboard.style.display = "block";
        loginMessage.textContent = "";

        await loadStudentRecords();

    } catch (error) {
        loginMessage.textContent =
            "Unable to connect to the backend. Please try again.";
        console.error("Admin login error:", error);
    }
});

document.getElementById("viewStudents").addEventListener(
    "click", loadStudentRecords
);

document.getElementById("logout").addEventListener("click", () => {
    sessionStorage.removeItem("adminToken");
    window.location.reload();
});

if (sessionStorage.getItem("adminToken")) {
    loginSection.style.display = "none";
    dashboard.style.display = "block";
    loadStudentRecords();
}
</script></body>
</html>
